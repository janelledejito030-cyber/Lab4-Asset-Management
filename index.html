<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratory Asset & Service Management</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1>Laboratory Asset & Service Management</h1>
        <p id="userInfo">Please sign in.</p>
      </div>
      <button id="logoutBtn" class="danger hidden">Logout</button>
    </header>

    <main class="container">
      <section id="loginView" class="card auth-card">
        <h2>Sign In</h2>
        <p class="muted">Use a Supabase account created for this laboratory system.</p>
        <form id="loginForm">
          <label>Email<input id="email" type="email" required></label>
          <label>Password<input id="password" type="password" required></label>
          <button type="submit">Login</button>
        </form>
        <p id="loginMessage" class="message"></p>
      </section>

      <section id="dashboardView" class="hidden">
        <div id="nav" class="nav"></div>
        <div id="content"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
